<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="#0B1F3A"/>
  <!-- Outer hex -->
  <polygon points="100,28 162,64 162,136 100,172 38,136 38,64"
    fill="none" stroke="#1E4080" stroke-width="8" stroke-linejoin="round"/>
  <!-- Orange top two edges -->
  <polyline points="38,64 100,28 162,64"
    fill="none" stroke="#E07B00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner hex -->
  <polygon points="100,54 132,72 132,108 100,126 68,108 68,72"
    fill="none" stroke="#1E4080" stroke-width="3" stroke-linejoin="round"/>
  <!-- Scan line -->
  <line x1="38" y1="100" x2="162" y2="100" stroke="#E07B00" stroke-width="3" stroke-linecap="round"/>
  <!-- Corner dots -->
  <circle cx="38" cy="64" r="5" fill="#E07B00"/>
  <circle cx="162" cy="64" r="5" fill="#1E4080" stroke="#E07B00" stroke-width="2.5"/>
  <!-- Bolt -->
  <polygon points="100,60 87,88 98,88 92,118 116,90 104,90 111,60" fill="#E07B00"/>
</svg>
